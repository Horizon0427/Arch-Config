background = #000000
foreground = {{colors.on_surface.default.hex}}
cursor-color = {{colors.primary.default.hex}}
cursor-text = {{colors.on_primary.default.hex}}
selection-background = {{colors.surface_variant.default.hex}}
selection-foreground = {{colors.on_surface_variant.default.hex}}

# 黑色 (0, 8) - 使用 surface 容器色
palette = 0={{colors.surface_container_highest.default.hex}}
palette = 8={{colors.surface_container_highest.default.hex | auto_lightness: 15.0}}

# 红色 (1, 9) - 使用 error 错误色
palette = 1={{colors.error.default.hex}}
palette = 9={{colors.error.default.hex | auto_lightness: 15.0}}

# 绿色 (2, 10) - 映射为 primary 主色
palette = 2={{colors.primary.default.hex}}
palette = 10={{colors.primary.default.hex | auto_lightness: 15.0}}

# 黄色 (3, 11) - 映射为 tertiary 强调色
palette = 3={{colors.tertiary.default.hex}}
palette = 11={{colors.tertiary.default.hex | auto_lightness: 15.0}}

# 蓝色 (4, 12) - 映射为 secondary 次要色
palette = 4={{colors.secondary.default.hex}}
palette = 12={{colors.secondary.default.hex | auto_lightness: 15.0}}

# 洋红/紫色 (5, 13) - 映射为 tertiary_fixed
palette = 5={{colors.tertiary_fixed.default.hex}}
palette = 13={{colors.tertiary_fixed.default.hex | auto_lightness: 15.0}}

# 青色 (6, 14) - 映射为 secondary_fixed
palette = 6={{colors.secondary_fixed.default.hex}}
palette = 14={{colors.secondary_fixed.default.hex | auto_lightness: 15.0}}

# 白色 (7, 15) - 使用 on_surface
palette = 7={{colors.on_surface_variant.default.hex}}
palette = 15={{colors.on_surface.default.hex}}
