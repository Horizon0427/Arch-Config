# vim: ft=dosini
[Metadata]
Name=Matugen Dynamic
Version=1.0
Author=Matugen
Description=Dynamic Material colors with Catppuccin-inspired rounded layout
ScaleWithDPI=True

[InputPanel]
Font=Sans 11
Spacing=2
NormalColor={{colors.on_surface.default.hex}}
HighlightCandidateColor={{colors.on_primary.default.hex}}
HighlightColor={{colors.primary.default.hex}}
HighlightBackgroundColor={{colors.primary.default.hex}}

[InputPanel/TextMargin]
Left=12
Right=12
Top=5
Bottom=5

[InputPanel/Background]
Color={{colors.surface_container.default.hex}}
Image=panel.svg

[InputPanel/Background/Margin]
Left=7
Right=7
Top=7
Bottom=7

[InputPanel/Highlight]
Color={{colors.primary.default.hex}}
Image=highlight.svg

[InputPanel/Highlight/Margin]
Left=12
Right=12
Top=5
Bottom=5

[Menu]
Font=Sans 10
NormalColor={{colors.on_surface.default.hex}}
Spacing=2

[Menu/Background]
Color={{colors.surface_container.default.hex}}

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/Highlight]
Color={{colors.primary.default.hex}}

[Menu/Highlight/Margin]
Left=8
Right=8
Top=4
Bottom=4

[Menu/Separator]
Color={{colors.outline_variant.default.hex}}

[Menu/CheckBox]
Image=radio.png

[Menu/SubMenu]
Image=arrow.png

[Menu/TextMargin]
Left=4
Right=4
Top=4
Bottom=4
