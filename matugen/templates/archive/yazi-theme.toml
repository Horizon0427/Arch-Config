prepend_files = [
    { name = "PKGBUILD", text = "", fg = "{{colors.primary.default.hex}}" },
    { name = "README.md", text = "󰂺", fg = "{{colors.secondary.default.hex}}" },
    { name = "Makefile", text = "", fg = "{{colors.secondary.default.hex}}" },
    { name = ".bashrc", text = "", fg = "{{colors.secondary.default.hex}}" },
