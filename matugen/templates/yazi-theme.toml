[mgr]
cwd = { fg = "white" }

find_keyword  = { fg = "{{palettes.contrary._90.hex}}", bold = true, italic = true, underline = true }
find_position = { fg = "{{palettes.contrary._70.hex}}", bold = true, italic = true }

marker_copied   = { fg = "yellow", bg = "black" }
marker_cut      = { fg = "red", bg = "black" }
marker_marked   = { fg = "{{palettes.contrary._20.hex}}", bg = "{{palettes.contrary._80.hex}}" }
marker_selected = { fg = "yellow", bg = "yellow" }

count_copied   = { fg = "black", bg = "yellow" }
count_cut      = { fg = "white", bg = "red" }
count_selected = { fg = "black", bg = "green" }

border_symbol = "│"
border_style  = { fg = "{{palettes.contrary._60.hex}}" }

[indicator]
padding = { open = "█", close = "█" }

[tabs]
active    = { fg = "green", bold = true }
inactive  = { fg = "{{palettes.contrary._70.hex}}" }
sep_inner = { open = "[", close = "]" }

[mode]
normal_main = { bg = "green", fg = "black", bold = true }
normal_alt  = { bg = "black", fg = "white" }

select_main = { bg = "blue", fg = "black", bold = true }
select_alt  = { bg = "black", fg = "white" }

unset_main = { bg = "yellow", fg = "black", bold = true }
unset_alt  = { bg = "black", fg = "white" }

[status]
sep_left  = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

perm_type  = { fg = "lightblue" }
perm_write = { fg = "lightyellow" }
perm_read  = { fg = "lightred" }
perm_exec  = { fg = "lightcyan" }
perm_sep   = { fg = "black" }

progress_label  = { bold = true }
progress_normal = { fg = "green", bg = "black" }
progress_error  = { fg = "red", bg = "black" }

[which]
cols = 3
mask = { bg = "black" }
cand = { fg = "green" }
rest = { fg = "white" }
desc = { fg = "white" }
separator = " ▶ "
separator_style = { fg = "{{palettes.contrary._70.hex}}" }

[notify]
title_info  = { fg = "lightcyan" }
title_warn  = { fg = "lightyellow" }
title_error = { fg = "lightred" }

[pick]
border = { fg = "green" }
active = { fg = "{{palettes.contrary._90.hex}}", bold = true }
inactive = {}

[input]
border = { fg = "{{palettes.contrary._70.hex}}" }
value  = { fg = "white" }

[cmp]
border = { fg = "{{palettes.contrary._70.hex}}", bg = "black" }

[tasks]
border  = { fg = "green" }
title   = {}
hovered = { fg = "{{palettes.contrary._90.hex}}", underline = true }

[help]
on     = { fg = "white" }
run    = { fg = "white" }
footer = { fg = "{{palettes.contrary._20.hex}}", bg = "{{palettes.contrary._80.hex}}" }

[filetype]
rules = [
    { mime = "image/*", fg = "cyan" },
    { mime = "{audio,video}/*", fg = "yellow" },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "{{palettes.contrary._80.hex}}" },
    { mime = "application/{pdf,doc,rtf}", fg = "lightgreen" },

    { url = "*", is = "orphan", bg = "red" },
    { url = "*", is = "exec", fg = "lightgreen" },

    { url = "*", fg = "white" },
    { url = "*/", fg = "blue" },
]

[icon]
prepend_conds = [
    { if = "dir & hidden", text = "", fg = "black" },
    { if = "dir", text = "", fg = "blue" },

    { if = "orphan", text = "󰌌", fg = "red" },
    { if = "link", text = "󰌷", fg = "yellow" },

    { if = "exec & !dir", text = "󰆧", fg = "lightcyan" },
    { if = "hidden", text = "󰈙", fg = "white" },
]

prepend_dirs = [
    { name = "Desktop", text = "", fg = "green" },
    { name = "Documents", text = "󰈙", fg = "green" },
    { name = "Downloads", text = "󰇚", fg = "green" },
    { name = "Pictures", text = "󰉏", fg = "green" },
    { name = "Music", text = "󰎆", fg = "green" },
    { name = "Videos", text = "󰕧", fg = "green" },
    { name = "Public", text = "", fg = "green" },

    { name = ".config", text = "", fg = "{{palettes.contrary._70.hex}}" },
    { name = ".git", text = "󰊢", fg = "blue" },
    { name = "Github", text = "󰊢", fg = "blue" },
    { name = "src", text = "", fg = "cyan" },
]

prepend_exts = [
    { name = "png", text = "󰉏", fg = "cyan" },
    { name = "jpg", text = "󰉏", fg = "cyan" },
    { name = "jpeg", text = "󰉏", fg = "cyan" },
    { name = "webp", text = "󰉏", fg = "cyan" },
    { name = "svg", text = "󰜡", fg = "cyan" },
    { name = "mp4", text = "󰕧", fg = "lightyellow" },
    { name = "mkv", text = "󰕧", fg = "lightyellow" },
    { name = "mp3", text = "󰎆", fg = "lightyellow" },
    { name = "flac", text = "󰎆", fg = "lightyellow" },

    { name = "zip", text = "󰛫", fg = "{{palettes.contrary._70.hex}}" },
    { name = "tar", text = "󰛫", fg = "{{palettes.contrary._70.hex}}" },
    { name = "gz", text = "󰛫", fg = "{{palettes.contrary._70.hex}}" },
    { name = "rar", text = "󰛫", fg = "{{palettes.contrary._70.hex}}" },
    { name = "7z", text = "󰛫", fg = "{{palettes.contrary._70.hex}}" },

    { name = "conf", text = "", fg = "{{palettes.contrary._70.hex}}" },
    { name = "toml", text = "", fg = "{{palettes.contrary._70.hex}}" },
    { name = "yaml", text = "", fg = "{{palettes.contrary._70.hex}}" },
    { name = "yml", text = "", fg = "{{palettes.contrary._70.hex}}" },
    { name = "json", text = "", fg = "{{palettes.contrary._70.hex}}" },
    { name = "sh", text = "", fg = "lightgreen" },
    { name = "bash", text = "", fg = "lightgreen" },
    { name = "py", text = "", fg = "lightgreen" },
    { name = "rs", text = "", fg = "lightgreen" },
    { name = "c", text = "", fg = "lightgreen" },
    { name = "cpp", text = "", fg = "lightgreen" },
    { name = "md", text = "", fg = "lightblue" },
    { name = "txt", text = "󰈙", fg = "white" },
]

prepend_files = [
    { name = "PKGBUILD", text = "", fg = "lightgreen" },
    { name = "README.md", text = "󰂺", fg = "lightblue" },
    { name = "Makefile", text = "", fg = "lightcyan" },
    { name = ".bashrc", text = "", fg = "{{palettes.contrary._90.hex}}" },
    { name = ".zshrc", text = "", fg = "{{palettes.contrary._90.hex}}" },
]
