# ========= Have you read the README.md ? ==========

[config]

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland_colors.lua'
output_path = '~/.config/hypr/configuration/colors.lua'

[templates.mako]
input_path = '~/.config/matugen/templates/mako-colors.conf'
output_path = '~/.config/mako/colors.conf'

[templates.wlogout]
input_path = '~/.config/matugen/templates/gtk-palette.css'
output_path = '~/.config/wlogout/colors.css'

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'

[templates.fastfetch]
input_path = '~/.config/matugen/templates/fastfetch-config.jsonc'
output_path = '~/.config/fastfetch/config.jsonc'

[templates.yazi]
input_path = '~/.config/matugen/templates/yazi-theme.toml'
output_path = '~/.config/yazi/theme.toml'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprlock-colors.conf'
output_path = '~/.config/hypr/hyprlock-colors.conf'

[templates.prelock]
input_path = '~/.config/matugen/templates/prelock-palette.conf'
output_path = '~/.config/prelock/palette.conf'

[templates.ghostty]
input_path = '~/.config/matugen/templates/ghostty-theme.conf'
output_path = '~/.config/ghostty/matugen-colors'

[templates.starship]
input_path = '~/.config/matugen/templates/starship.toml'
output_path = '~/.config/starship.toml'

[templates.nvim]
input_path = '~/.config/matugen/templates/nvim-colors.lua'
output_path = '~/.cache/matugen/nvim-colors.lua'

[templates.gtk-icons]
input_path = '~/.config/matugen/templates/gtk-icons.conf'
output_path = '~/.cache/matugen/gtk-icons.conf'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk3-colors.css'
output_path = '~/.local/share/themes/adw-gtk3-dark-matugen/gtk-3.0/colors.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'

[templates.ironbar]
input_path = '~/.config/matugen/templates/gtk-palette.css'
output_path = '~/.config/ironbar/colors.css'

[templates.walker]
input_path = '~/.config/matugen/templates/gtk-palette.css'
output_path = '~/.config/walker/themes/minimal/colors.css'

[templates.copyq]
input_path = '~/.config/matugen/templates/copyq.ini'
output_path = '~/.config/copyq/themes/matugen.ini'

[templates.fcitx5]
input_path = '~/.config/matugen/templates/fcitx5-theme.conf'
output_path = '~/.local/share/fcitx5/themes/catppuccin-mocha-mauve/theme.conf'

[templates.fcitx5-panel]
input_path = '~/.config/matugen/templates/fcitx5-panel.svg'
output_path = '~/.local/share/fcitx5/themes/catppuccin-mocha-mauve/panel.svg'

[templates.fcitx5-highlight]
input_path = '~/.config/matugen/templates/fcitx5-highlight.svg'
output_path = '~/.local/share/fcitx5/themes/catppuccin-mocha-mauve/highlight.svg'

[templates.codex]
input_path = '~/.config/matugen/templates/codex-theme.json'
output_path = '~/.codex/matugen/theme.json'

[templates.flclash]
input_path = '~/.config/matugen/templates/flclash-color.txt'
output_path = '~/.local/share/com.follow.clash/matugen_color'

[templates.mdr]
input_path = '~/.config/matugen/templates/mdr-colors.css'
output_path = '~/.config/mdr/colors.css'
