source = ~/.config/hypr/hyprlock-colors.conf

$font = Anthropic Serif Text

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = breathing, 0.4, 0.0, 0.2, 1.0
    bezier = morning_mist, 0.5, 0.0, 0.0, 1.0
    animation = fade, 1, 10, breathing
    animation = inputField, 1, 5, morning_mist
    animation = inputFieldDots, 1, 4, breathing
}

background {
    monitor =
    path = /home/horizon/.config/hypr/current_wallpaper.png
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/song_status.sh
    color = $tertiary_d0
    font_size = 30
    font_family = $font
    position = 0, -50
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:0:1] ~/.config/hypr/scripts/lock_fortune.sh
    color = $tertiary_d0
    font_size = 26
    font_family = $font
    text_align = left
    position = 70, 70
    halign = left
    valign = bottom
}

label {
    monitor =
    text = <span font_weight="medium">$TIME</span>
    color = $primary
    font_size = 150
    font_family = $font

    position = 0, 300
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:43200000] env LC_TIME=C date +"%A, %d %B"
    color = $primary
    font_size = 40
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

shape {
    monitor =
    size = 224, 224
    color = rgba(00000000)
    rounding = -1
    border_size = 1
    border_color = $primary_80
    position = 0, -60
    halign = center
    valign = center
}

image {
    monitor =
    path = /home/horizon/.config/hypr/avatar.jpg
    size = 200
    rounding = -1
    border_size = 4
    border_color = $primary
    position = 0, -60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 350, 90
    outline_thickness = 5
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    outer_color = $primary $tertiary 45deg
    inner_color = $surface_container_b3
    font_color = $on_surface
    fade_on_empty = false
    font_family = $font
    placeholder_text = <i><span foreground="$outline_pango">Enter Password</span></i>
    hide_input = false

    fail_color = $error $error_container 40deg
    fail_text = <i>$PAMFAIL</i>

    position = 0, -250
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[en,ru]
    color = $on_surface_variant
    font_size = 25
    position = 0, -340
    halign = center
    valign = center
}

shape {
    monitor =
    size = 140%, 16%
    color = $primary_4d
    rounding = 0
    border_size = 0
    rotate = 45
    zindex = -1
    position = 52.1%, 0
    halign = center
    valign = center
}

shape {
    monitor =
    size = 140%, 12.8%
    color = $tertiary_4d
    rounding = 0
    border_size = 0
    rotate = 45
    zindex = -1
    position = 65.5%, 0
    halign = center
    valign = center
}

shape {
    monitor =
    size = 140%, 10.67%
    color = $secondary_4d
    rounding = 0
    border_size = 0
    rotate = 45
    zindex = -1
    position = 76.6%, 0
    halign = center
    valign = center
}
