source = ~/.config/hypr/new-version/colors.conf

xwayland {
    force_zero_scaling = true
}

################
### MONITORS ###
################

monitor = eDP-1, 3072x1920@120.00, 0x0, 2.0

###################
### MY PROGRAMS ###
###################

$terminal    = ghostty
$fileManager = thunar
$menu        = rofi -show drun -theme ~/.config/rofi/launchers/type-7/style-2.rasi

#################
### AUTOSTART ###
#################

exec-once = mako
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = waybar -c ~/.config/waybar/config-top.jsonc -s ~/.config/waybar/style-top.css
exec-once = blueman-applet
exec-once = nm-applet
exec-once = hypridle
exec-once = awww-daemon
exec-once = copyq
exec-once = fcitx5
exec-once = echo "Xft.dpi:192" | xrdb -merge
exec-once = hyprsunset -t 6500 -g 100
exec-once = hyprpm reload -n

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_THEME,    BreezeX-RosePine-Linux
env = XCURSOR_SIZE,     28
env = HYPRCURSOR_THEME, BreezeX-RosePine-Linux
env = HYPRCURSOR_SIZE,  28

env = QT_IM_MODULE, fcitx
env = XMODIFIERS,   @im=fcitx

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in  = 2.5
    gaps_out = 6

    border_size = 3

    col.active_border   = $primary rgba(ffffffff) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = false
    allow_tearing    = false
    layout = scrolling

    snap {
        enabled        = true
        window_gap     = 10
        monitor_gap    = 20
        border_overlap = true
        respect_gaps   = true
    }
}

decoration {
    rounding       = 15
    rounding_power = 3

    active_opacity     = 1.0
    inactive_opacity   = 1.0
    fullscreen_opacity = 1.0

    shadow {
        enabled      = true
        range        = 4
        render_power = 3
        color        = rgba(1a1a1aee)
    }

    blur {
        enabled           = true
        size              = 7
        passes            = 3
        vibrancy          = 0.1696
        new_optimizations = true
        popups            = true
        input_methods     = true
    }

    glow {
        enabled      = true
        range        = 12
        render_power = 2
        color        = $primary
    }
}

animations {
    enabled = true

    # 原有曲线
    bezier = easeOutQuint,   0.22, 1,    0.36, 1
    bezier = easeInOutCubic, 0.65, 0,    0.35, 1
    bezier = linear,         0,    0,    1,    1
    bezier = quickSnap,      0.15, 0,    0.1,  1
    bezier = layerEase,      0.4,  0.0,  0.2,  1.0

    # [0.55 新增] Spring 弹簧曲线
    # hyprlang 中用 bezier 近似模拟弹簧手感（轻微超调）
    # 真正的 spring 曲线（mass/stiffness/dampening）需要 Lua 格式
    bezier = springy,        0.34, 1.20, 0.40, 0.95
    bezier = springySubtle,  0.25, 1.05, 0.35, 1.00

    # 窗口进出：保持原有风格
    animation = windowsIn,   1, 7,  easeOutQuint, popin 50%
    animation = windowsOut,  1, 7,  easeOutQuint, gnomed
    # 窗口移动/整理：换用 springy 增加弹性质感
    animation = windowsMove, 1, 6,  springy

    animation = border,      1, 4,  quickSnap
    animation = borderangle, 1, 30, linear, loop

    animation = fade,        1, 4, layerEase
    animation = fadeIn,      1, 4, layerEase
    animation = fadeOut,     1, 4, layerEase
    animation = fadeSwitch,  1, 4, layerEase
    animation = fadeShadow,  1, 4, layerEase
    animation = fadeDim,     1, 4, layerEase
    animation = fadePopups,  0, 4, layerEase

    # 工作区切换：换用 springySubtle，滑入感更自然
    animation = workspacesIn,     1, 5, springySubtle, slidefade 20%
    animation = workspacesOut,    1, 5, springySubtle, slidefade 20%
    animation = specialWorkspace, 1, 5, springySubtle, slidevert

    animation = layersIn,  1, 4, layerEase, popin 50%
    animation = layersOut, 1, 3, layerEase, popin 50%
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

# [0.55 新增] 窗口组 groupbar 中键直接关闭
group {
    groupbar {
        middle_click_close = true
        scrolling          = true
        blur               = false
    }
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo   = false
}

######################
### SCROLLING 布局  ###
######################

scrolling {
    fullscreen_on_one_column = true
    column_width             = 0.5
    direction                = right
    focus_fit_method         = 1
    follow_focus             = false

    wrap_focus   = true
    wrap_swapcol = true

    # [0.55 新增] 方向键移动窗口时自动触发 consume 行为（跨列合并）
    # auto_consuming = false
}

#############
### INPUT ###
#############

input {
    kb_layout    = us
    kb_variant   =
    kb_model     =
    kb_options   =
    kb_rules     =
    accel_profile = flat
    follow_mouse  = 1
    repeat_delay  = 250
    repeat_rate   = 35
    sensitivity   = 1.0

    touchpad {
        natural_scroll          = true
        disable_while_typing    = true
        middle_button_emulation = true
    }
}

# 三指横扫切换工作区（原有）
gesture = 3, horizontal, workspace

# [0.55 新增] 三指纵扫驱动 scrolling 布局左右滚动
# 语法待升级后对照 wiki 确认，此处为推测写法
# gesture = 3, vertical, scrolling:scroll_move

# [0.55 新增] 双指捏合 实时缩放（live pinch zoom）
gesture = 2, pinch, zoom

device {
    name        = epic-mouse-v1
    sensitivity = -0.5
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# ── 应用与系统 ────────────────────────────────────
bind = $mainMod,         Q,   exec, $terminal
bind = $mainMod,         E,   exec, $fileManager
bind = $mainMod,         R,   exec, $menu
bind = $mainMod,         S,   exec, google-chrome-stable
bind = $mainMod,         A,   exec, flclash
bind = $mainMod,         Z,   exec, ~/.config/custom_wall_paper/wallpicker
bind = $mainMod,         C,   killactive
bind = $mainMod,         U,   exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod,         F,   fullscreen, 0
bind = $mainMod,         V,   togglefloating
bind = $mainMod,         X,   togglespecialworkspace, spotify
bind = $mainMod,         D,   exec, ~/.config/hypr/scripts/toggle_layout.sh
bind = $mainMod,         G,   exec, ~/.config/hypr/scripts/ghostty_cursor.sh

bind = $mainMod,         F1,  exec, ~/.config/waybar/scripts/toggle-waybar.sh
bind = $mainMod,         F2,  exec, ~/.config/waybar/scripts/reload-waybar.sh
bind = $mainMod,         F3,  exec, hyprctl hyprsunset temperature 4000
bind = $mainMod,         F4,  exec, hyprctl hyprsunset gamma 80
bind = $mainMod,         F5,  exec, sh -c 'hyprctl hyprsunset identity && hyprctl hyprsunset gamma 100'

bind = $mainMod ALT,     L,   exec, ~/.config/hypr/scripts/smart_lock.sh
bind = $mainMod ALT,     V,   exec, copyq toggle
bind = $mainMod SHIFT,   S,   exec, ~/.config/hypr/scripts/screenshot.sh

# ── 焦点移动 ─────────────────────────────────────
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# ── 工作区切换 ────────────────────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod ALT, 1, movetoworkspace, 1
bind = $mainMod ALT, 2, movetoworkspace, 2
bind = $mainMod ALT, 3, movetoworkspace, 3
bind = $mainMod ALT, 4, movetoworkspace, 4
bind = $mainMod ALT, 5, movetoworkspace, 5
bind = $mainMod ALT, 6, movetoworkspace, 6
bind = $mainMod ALT, 7, movetoworkspace, 7
bind = $mainMod ALT, 8, movetoworkspace, 8
bind = $mainMod ALT, 9, movetoworkspace, 9
bind = $mainMod ALT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# ── Scrolling 布局：原有操作 ──────────────────────
bind = $mainMod,     W,            layoutmsg, colresize +conf
bind = $mainMod,     O,            layoutmsg, fit all
bind = $mainMod ALT, O,            layoutmsg, fit active
bind = $mainMod ALT, P,            layoutmsg, promote
bind = $mainMod,     bracketleft,  layoutmsg, colresize -0.1
bind = $mainMod,     bracketright, layoutmsg, colresize +0.1
bind = $mainMod,     comma,        layoutmsg, swapcol l
bind = $mainMod,     period,       layoutmsg, swapcol r

# ── Scrolling 布局：0.55 新增操作 ─────────────────
# expel   = 把当前窗口从列中弹出，独立成新列
# consume = 把相邻列的下一个窗口吸入当前列（堆叠）
# consume_or_expel = 智能切换：已堆叠则弹出，独立则吸入
bind = $mainMod SHIFT, E, layoutmsg, expel
bind = $mainMod SHIFT, I, layoutmsg, consume
bind = $mainMod SHIFT, T, layoutmsg, consume_or_expel

# [0.55 新增] 将当前列居中显示
bind = $mainMod, M, layoutmsg, center

# ── Dwindle 布局：新增操作 ────────────────────────
# [0.55 新增] rotatesplit：旋转当前分割方向
bind = $mainMod, T, layoutmsg, rotatesplit

# dwindle 的 togglesplit（原有）
bind = $mainMod, J, layoutmsg, togglesplit

# ── 窗口组（Group）管理 ───────────────────────────
# [0.55 新增] moveintoorcreategroup：移入现有组或新建组
bind = $mainMod CTRL, left,  moveintoorcreategroup, l
bind = $mainMod CTRL, right, moveintoorcreategroup, r
bind = $mainMod CTRL, up,    moveintoorcreategroup, u
bind = $mainMod CTRL, down,  moveintoorcreategroup, d

# ── 鼠标操作 ─────────────────────────────────────
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ── 多媒体 / 功能键 ───────────────────────────────
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl  = , Print,                 exec, grim ~/Pictures/quickshot/quickshot_$(date +'%Y-%m-%d_%H-%M-%S').png
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPause,        exec, playerctl play-pause
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioPrev,         exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    name        = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name           = fix-xwayland-drags
    match:class    = ^$
    match:title    = ^$
    match:xwayland = true
    match:float    = true
    match:fullscreen = false
    match:pin      = false
    no_focus = true
}

windowrule {
    name        = move-hyprland-run
    match:class = hyprland-run
    move  = 20 monitor_h-120
    float = yes
}

windowrule {
    name        = float-waypaper
    match:class = ^(waypaper)$
    float  = true
    center = true
}

windowrule {
    name        = float-copyq
    match:class = ^(com.github.hluk.copyq)$
    float  = true
    center = true
}

windowrule {
    name        = float-screenshot
    match:class = be.alexandervanhee.gradia
    float  = true
    center = true
}

windowrule {
    name        = screenshot-save
    match:class = ^(xdg-desktop-portal-gtk)
    float  = true
    center = true
    size   = 900 600
}

windowrule {
    name        = transparent-terminal
    match:class = com.mitchellh.ghostty
    opacity = 1.0 override 0.5 override
}

windowrule {
    name        = prelock-fullscreen
    match:class = ^(Smooth_Prelock)$
    fullscreen = true
}

windowrule {
    name        = longshot-overlay-rules
    match:class = ^(longshot_overlay)$
    float            = true
    border_size      = 0
    rounding         = 0
    no_blur          = true
    no_shadow        = true
    no_initial_focus = true
    no_focus         = true
    pin              = true
    suppress_event   = activatefocus maximize fullscreen
}

windowrule {
    name        = wall-paper-picker
    match:class = ^(wallpicker)$
    fullscreen   = true
    center       = true
    stay_focused = true
    animation    = popin 0
}

windowrule {
    name        = spotify
    match:class = (?i)^(spotify)$
    workspace = special:spotify
}

# [0.55 新增] scrolling_width：为特定应用单独设定列宽
windowrule {
    name        = scrolling-width-thunar
    match:class = ^(thunar)$
    scrolling_width = 0.35
}

windowrule {
    name        = scrolling-width-copyq
    match:class = ^(com.github.hluk.copyq)$
    scrolling_width = 0.3
}

layerrule {
    name            = wlogout_blur
    match:namespace = ^(logout_dialog)$
    blur         = on
    ignore_alpha = -1.1
}

layerrule {
    name            = slurp-selection-noanim
    match:namespace = ^(selection)$
    no_anim = true
}

layerrule {
    name            = Liquid_Glass_Waybar
    match:namespace = ^(waybar)$
    blur         = on
    ignore_alpha = 0.25
}

plugin {
    dynamic-cursors {
        enabled   = true
        mode      = stretch
        threshold = 2

        stretch {
            limit    = 2500
            function = quadratic
        }
        shake {
            enabled = false
        }
    }
}
