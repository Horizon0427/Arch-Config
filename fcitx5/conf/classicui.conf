# Display one candidate per row.
Vertical Candidate List=True

# Catppuccin layout with colors generated by Matugen.
Font="Sans 11"
Theme=catppuccin-mocha-mauve
DarkTheme=catppuccin-mocha-mauve
UseDarkTheme=False
UseAccentColor=False

# Let Fcitx5 scale correctly under Hyprland/Wayland.
PerScreenDPI=True
ForceWaylandDPI=0
EnableFractionalScale=True
