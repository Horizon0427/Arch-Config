position = "bottom"
height = 24
margin_top = 4
margin_bottom = 4
ironvar_defaults.spotify_running = "false"


[[start]]
type = "workspaces"
hidden = ["special:spotify"]

[[start]]
type = "script"
class = "custom-battery"
mode = "poll"
interval = 30000
cmd = "~/.config/ironbar/scripts/modules/battery.sh"

[[start]]
type = "script"
class = "volume"
mode = "watch"
cmd = "~/.config/ironbar/scripts/modules/volume.sh watch"
on_scroll_up   = "~/.config/ironbar/scripts/modules/volume.sh up"
on_scroll_down = "~/.config/ironbar/scripts/modules/volume.sh down"
on_click_left  = "~/.config/ironbar/scripts/modules/volume.sh open"
on_click_right = "~/.config/ironbar/scripts/modules/volume.sh mute"

[[start]]
type = "script"
class = "clock"
mode = "watch"
cmd = "~/.config/ironbar/scripts/modules/clock.sh watch"
tooltip = "{{~/.config/ironbar/scripts/modules/clock.sh date}}"


[[start]]
type = "script"
class = "bluetooth"
mode = "watch"
cmd = "~/.config/ironbar/scripts/modules/bluetooth.sh watch"
tooltip = "{{~/.config/ironbar/scripts/modules/bluetooth.sh tooltip}}"
on_click_left = "~/.config/ironbar/scripts/modules/bluetooth.sh open"

[[start]]
type = "script"
class = "brightness"
mode = "poll"
interval = 500
cmd = "~/.config/ironbar/scripts/modules/brightness.sh status"
on_scroll_up = "~/.config/ironbar/scripts/modules/brightness.sh up"
on_scroll_down = "~/.config/ironbar/scripts/modules/brightness.sh down"

[[start]]
type = "script"
class = "longshot"
mode = "watch"
cmd = "/home/horizon/Projects/python-projects/hypr-longshot/.venv/bin/python /home/horizon/Projects/python-projects/hypr-longshot/longshot.py watch --icon"
on_click_left = "/home/horizon/Projects/python-projects/hypr-longshot/.venv/bin/python /home/horizon/Projects/python-projects/hypr-longshot/longshot.py toggle"
on_click_right = "/home/horizon/Projects/python-projects/hypr-longshot/.venv/bin/python /home/horizon/Projects/python-projects/hypr-longshot/longshot.py cancel"



[[center]]
type = "script"
name = "power-btn"
class = "power-btn"
mode = "watch"
cmd = "~/.config/ironbar/scripts/modules/power-profile.sh watch"
tooltip = "{{~/.config/ironbar/scripts/modules/power-profile.sh current}}"
on_click_left = "~/.config/ironbar/scripts/modules/power-profile.sh toggle"



[[end]]
type = "script"
class = "cava"
mode = "watch"
cmd = "~/.config/ironbar/scripts/cava.sh"

[[end]]
type = "label"
name = "prev"
label = "󰒮"
show_if = "#spotify_running"
tooltip = "Previous"
on_click_left = "~/.config/ironbar/scripts/modules/spotify.sh previous"

[[end]]
type = "script"
class = "play-pause"
mode = "watch"
show_if = "#spotify_running"
cmd = "~/.config/ironbar/scripts/modules/spotify.sh watch"
tooltip = "{{~/.config/ironbar/scripts/modules/spotify.sh metadata}}"
on_click_left = "~/.config/ironbar/scripts/modules/spotify.sh toggle"


[[end]]
type = "label"
name = "next"
label = "󰒭"
show_if = "#spotify_running"
tooltip = "Next"
on_click_left = "~/.config/ironbar/scripts/modules/spotify.sh next"

[[end]]
type = "tray"
name = "tray-bottom"
icon_size = 18
on_click_left = "default"
on_click_right = "menu"
on_mouse_enter = "~/.config/ironbar/scripts/modules/tray-lifecycle.sh clear tray-bottom"

[[end]]
type = "script"
name = "tray-lifecycle-watch"
class = "tray-lifecycle-watch"
mode = "watch"
cmd = "~/.config/ironbar/scripts/modules/tray-lifecycle.sh watch-reset tray-bottom"

[[end]]
type = "label"
name = "power"
label = "⏻"
on_click_left = "wlogout -b 3 -T 300 -B 300"
