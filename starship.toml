[status]
disabled = false
symbol = "×"
style = "fg:error bold"
format = '[$symbol]($style)[ $status ](fg:error)[◆](fg:error bold)[───](fg:rail_dim)'

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "fg:accent_warm"
format = '[◆](fg:accent_warm bold)[ 󰥔 $duration ]($style)[◆](fg:accent_warm bold)[───](fg:rail_dim)'

[character]
success_symbol = "[◆](fg:accent_mid bold)[ ❯](fg:accent_mid bold)"
error_symbol = "[❯](fg:error bold)"
vimcmd_symbol = "[◆](fg:primary bold)[ ❮](fg:primary bold)"
vimcmd_replace_one_symbol = "[◆](fg:accent_warm bold)[ ❮](fg:accent_warm bold)"
vimcmd_replace_symbol = "[◆](fg:accent_warm bold)[ ❮](fg:accent_warm bold)"
vimcmd_visual_symbol = "[◆](fg:accent_cool bold)[ ❮](fg:accent_cool bold)"

[time]
disabled = false
time_format = "%R"
style = "fg:accent_warm"
format = '[───](fg:rail_dim)[◆](fg:accent_warm bold)[ 󰥔 $time ]($style)[◆](fg:accent_warm bold)'
