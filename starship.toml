"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
palette = "matugen"

format = """
[╭──](fg:rail)\
$username\
$hostname\
[◆](fg:primary bold)\
[ ](fg:primary bold)\
$directory\
[◆](fg:primary bold)\
$git_branch\
$git_status\
$git_state\
$python\
$nodejs\
$bun\
$deno\
$rust\
$golang\
$php\
$c\
$cpp\
$cmake\
$java\
$kotlin\
$gradle\
$dotnet\
$lua\
$ruby\
$perl\
$haskell\
$elixir\
$erlang\
$julia\
$rlang\
$fortran\
$swift\
$zig\
$typst\
$dart\
$time\
$line_break\
[╰──](fg:rail)\
$status\
$cmd_duration\
$character"""

[palettes.matugen]
rail = "#dae5e3"
rail_dim = "#bec9c7"
primary = "#81d5ce"
primary_soft = "#9df2ea"
accent_cool = "#81d5ce"
accent_mid = "#b0c9e7"
accent_warm = "#bbcd9e"
tertiary = "#b0c9e7"
error = "#ffb4ab"
text = "#dde4e2"
muted = "#bec9c7"

[username]
show_always = false
style_user = "fg:accent_cool"
style_root = "fg:error bold"
format = '[◆](fg:accent_cool bold)[ $user ]($style)[◆](fg:accent_cool bold)[───](fg:rail_dim)'

[hostname]
ssh_only = true
style = "fg:accent_cool"
format = '[◆](fg:accent_cool bold)[ @$hostname ]($style)[◆](fg:accent_cool bold)[───](fg:rail_dim)'

[directory]
style = "fg:text bold"
format = "[ $path ]($style)"
truncation_length = 4
truncate_to_repo = false
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "fg:error"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = "󰝚"
"Pictures" = ""
"UCAS/Science" = "󰧑"

[git_branch]
symbol = ""
style = "fg:accent_cool"
format = '[───](fg:rail_dim)[◆](fg:accent_cool bold)[ $symbol $branch ]($style)[◆](fg:accent_cool bold)'
truncation_length = 24
truncation_symbol = "…"

[git_status]
style = "fg:tertiary bold"
format = '([───](fg:rail_dim)[◆](fg:tertiary bold)[ $all_status$ahead_behind]($style)[◆](fg:tertiary bold))'
conflicted = "≠${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "*${count} "
modified = "Δ${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "×${count} "

[git_state]
style = "fg:accent_warm bold"
format = '[───](fg:rail_dim)[◆](fg:accent_warm bold)[ $state( $progress_current/$progress_total) ]($style)[◆](fg:accent_warm bold)'

[python]
symbol = ""
style = "fg:accent_mid"
version_format = "${major}.${minor}"
format = '[───](fg:rail_dim)[◆](fg:accent_mid bold)[ $symbol $version( · $virtualenv) ]($style)[◆](fg:accent_mid bold)'
detect_extensions = []
detect_files = [
  ".python-version",
  "Pipfile",
  "pyproject.toml",
  "requirements.txt",
  "setup.py",
  "tox.ini",
  "uv.lock",
  "environment.yml",
  "environment.yaml",
]
detect_folders = [".venv", "venv"]

[nodejs]
symbol = ""
style = "fg:accent_mid"
version_format = "${major}.${minor}"
format = '[───](fg:rail_dim)[◆](fg:accent_mid bold)[ $symbol $version ]($style)[◆](fg:accent_mid bold)'

